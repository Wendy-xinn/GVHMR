# @package _global_
defaults:
  - override /data: egobody/egoexo_v1
  - override /model: gvhmr/gvhmr_pl
  - override /endecoder: gvhmr/v1_amass_local_bedlam_cam
  - override /optimizer: adamw_2e-4
  - override /scheduler_cfg: epoch_half_200_350
  - override /network: gvhmr/relative_transformer
  - override /callbacks:
      - simple_ckpt_saver/every10e_top100
      - prog_bar/prog_reporter_every0.1
      - train_speed_timer/base
      - lr_monitor/pl
  - _self_

exp_name: egobody_egoexo_stage1
data_name: egobody_egoexo_v1

network:
  ego_output_dim: 145

model:
  freeze_backbone: false
  freeze_exo_head: true
  freeze_ego_head: false
  copy_exo_to_ego: false
  backbone_lr_scale: 0.1
  vis_every_n_steps: 500
  val_vis_every_n_batches: 80

pipeline:
  _target_: hmr4d.model.gvhmr.pipeline.gvhmr_pipeline.Pipeline
  args_denoiser3d: ${network}
  args:
    endecoder_opt: ${endecoder}
    normalize_cam_angvel: true
    branch_mode: both
    input_role: ego
    train_input_role: ego
    supervise_role: ego
    freeze_exo_head: true
    ego_head_type: cpf
    enable_frozen_ego_image_exo: false
    weights:
      cr_j3d: 500.
      transl_c: 0.
      cr_verts: 500.
      j2d: 0.
      verts2d: 0.
      transl_w: 1.
      static_conf_bce: 1.
      ego_head_trans: 50.
    static_conf:
      vel_thr: 0.15
    ego_head_joint_id: 15
    ego_head_loss_target: smpl_head_gt

pl_trainer:
  precision: 16-mixed
  log_every_n_steps: 10
  gradient_clip_val: 0.5
  max_epochs: 200
  check_val_every_n_epoch: 5
  devices: 1

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: ${output_dir}
  name: tb
  version: ${now:%m%d_%H%M%S}
