# @package _global_
defaults:
  - override /data: egobody/egoexo_v1
  - override /model: gvhmr/gvhmr_pl
  - override /endecoder: gvhmr/v1_amass_local_bedlam_cam
  - override /optimizer: adamw_2e-4
  - override /scheduler_cfg: epoch_half_200_350
  - override /network: gvhmr/relative_transformer
  - override /callbacks:
      - simple_ckpt_saver/every10e_top100
      - prog_bar/prog_reporter_every0.1
      - train_speed_timer/base
      - lr_monitor/pl
  - _self_

exp_name: egobody_egoexo_stage2_both
data_name: egobody_egoexo_v1

network:
  ego_output_dim: 148
  cam_trans_vel_dim: 3
  gravity_dim: 3
  interaction_dim: 10
  cross_view_fusion: false
  cross_view_heads: 4

model:
  freeze_backbone: true
  freeze_exo_head: false
  freeze_ego_head: false
  copy_exo_to_ego: false
  copy_exo_to_ego_after_load: false
  copy_exo_to_ego_mode: pose
  backbone_lr_scale: 0.005
  unfreeze_last_n_blocks: 2
  vis_every_n_steps: 500
  val_vis_every_n_batches: 80

pipeline:
  _target_: hmr4d.model.gvhmr.pipeline.gvhmr_pipeline.Pipeline
  args_denoiser3d: ${network}
  args:
    endecoder_opt: ${endecoder}
    normalize_cam_angvel: true
    branch_mode: both
    freeze_exo_head: false
    train_input_role: mixed
    train_ego_prob: 0.7
    input_role: exo
    supervise_role: auto
    add_other_role_image_condition: false
    exo_world_loss_mode: incam_kinect
    ego_head_type: cpf
    ego_motion_mode: cam_angvel_cpf
    enable_frozen_ego_image_exo: false
    use_interaction_condition: true
    use_cross_view_teacher: false
    virtual_ego_from_exo:
      enabled: true
      mode: fixed_observer
      head_camera_offset: [0.0, 0.5, 0.6]
    weights:
      cr_j3d: 500.
      transl_c: 1.
      cr_verts: 500.
      j2d: 1000.
      verts2d: 1000.
      transl_w: 0.05
      static_conf_bce: 0.5
      ego_head_trans: 50.
      ego_upper_j3d: 200.
      ego_upper_limb: 100.
      ego_first_transl_w: 20.
      ego_local_transl_vel: 100.
      ego_direct_vel_consistency: 20.
      ego_floor: 0.5
      ego_floor_penetration: 1.0
      ego_foot_sliding: 50.0
      ego_root_accel: 10.0
      ego_pose_accel: 2.0
    static_conf:
      vel_thr: 0.15
    ego_head_joint_id: 15
    ego_head_loss_target: smpl_head_gt

pl_trainer:
  precision: 16-mixed
  log_every_n_steps: 10
  gradient_clip_val: 0.5
  max_epochs: 200
  check_val_every_n_epoch: 5
  devices: 1

logger:
  _target_: pytorch_lightning.loggers.TensorBoardLogger
  save_dir: ${output_dir}
  name: tb
  version: ${now:%m%d_%H%M%S}
